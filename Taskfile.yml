# Developer workflow entry points for this repository.
#
# Every task below is a thin wrapper around a command documented in
# docs/validation.md that can also be run directly, without Task. Task prints
# each command before running it, so a task never does more than it shows.
#
# Task orchestrates workflow only. Nothing here owns infrastructure state, runs
# an infrastructure apply or destroy, decrypts secrets, reads a private
# repository or inventory, or contacts deployment infrastructure. No task
# declares `sources:` or `status:`, so no result is cached between runs and no
# check is silently skipped.
#
# Tool versions come from .tool-versions and requirements-dev.txt; see
# docs/toolchain.md.

version: '3'

# The Markdown, YAML, and link checks are pipelines, so a failure in the
# file-listing stage must fail the task rather than being masked by the tool.
set: [pipefail]

vars:
  # The directory to prefer for the Python validation tools that
  # requirements-dev.txt installs. For a virtual environment kept somewhere
  # else, override it on the command line:
  # `task validate VENV_BIN=path/to/bin`.
  VENV_BIN: .venv/bin

  # The prefix the tasks below actually invoke those tools with, resolved each
  # time Task starts: the directory above when the tools there run, and
  # otherwise empty, so the tools are taken from PATH as a development
  # container provides them.
  #
  # Each candidate is probed by running it rather than by testing that the file
  # exists. A virtual environment built on the host and then bind-mounted into a
  # container of another platform is present and executable, yet cannot run
  # there, so an existence test would select a tool that fails at use.
  #
  # An empty result is not assumed to be working: every task using these tools
  # has a precondition that runs the resolved command before the check does.
  # The probe is delegated to /bin/sh because Task's own shell reports a binary
  # it cannot execute as a fatal error rather than as a failed command, which
  # is precisely the case being probed for. The trailing `exit 0` keeps an
  # unusable candidate from failing the whole run.
  PYTHON_TOOL_PREFIX:
    sh: sh -c '"{{.VENV_BIN}}/yamllint" --version >/dev/null 2>&1 && "{{.VENV_BIN}}/check-jsonschema" --version >/dev/null 2>&1 && printf "%s/" "{{.VENV_BIN}}"; exit 0'

tasks:
  default:
    desc: List the available tasks.
    cmds:
      - task --list
    silent: true

  validate:
    desc: Run every local validation check. Leaves tracked content unchanged; stops at the first failure.
    cmds:
      # Ordered cheapest and most local first, so the three checks that need
      # network access run last.
      - task: validate:whitespace
      - task: validate:python-lock
      - task: validate:markdown
      - task: validate:yaml
      - task: validate:schemas
      - task: validate:workflows
      - task: validate:workflow-audit
      - task: validate:public-safety
      - task: validate:safety-patterns
      - task: validate:secrets
      - task: validate:ansible
      - task: validate:tofu
      - task: validate:composition
      - task: validate:example
      - task: validate:links

  validate:whitespace:
    desc: 'Hygiene: check every tracked file for whitespace errors.'
    cmds:
      - git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  validate:python-lock:
    desc: 'Hygiene: check the Python dependency lock still matches its declaration.'
    cmds:
      - ./scripts/check-python-lock.sh

  validate:markdown:
    desc: 'Documentation: lint tracked Markdown.'
    cmds:
      # Scoped to tracked files: an untracked or ignored Markdown file in a
      # local working tree is absent from a CI checkout, so linting it would
      # make the local result diverge from CI. See docs/validation.md.
      - git ls-files -z '*.md' | xargs -0 markdownlint-cli2

  validate:links:
    desc: 'Documentation: check links in tracked Markdown. Needs public network access.'
    cmds:
      - git ls-files -z '*.md' | xargs -0 lychee --no-progress

  validate:yaml:
    desc: 'GitHub configuration: lint tracked YAML.'
    preconditions:
      - sh: '{{.PYTHON_TOOL_PREFIX}}yamllint --version >/dev/null 2>&1'
        msg: 'yamllint runs from neither {{.VENV_BIN}} nor PATH. See docs/validation.md for the setup commands.'
    cmds:
      # The pathspec covers the file names yamllint selects by default: the two
      # YAML suffixes and its own configuration file.
      - git ls-files -z '*.yml' '*.yaml' '.yamllint' | xargs -0 {{.PYTHON_TOOL_PREFIX}}yamllint

  validate:schemas:
    desc: 'GitHub configuration: validate workflow, action, Dependabot, and Taskfile schemas.'
    preconditions:
      - sh: '{{.PYTHON_TOOL_PREFIX}}check-jsonschema --version >/dev/null 2>&1'
        msg: 'check-jsonschema runs from neither {{.VENV_BIN}} nor PATH. See docs/validation.md for the setup commands.'
    cmds:
      - '{{.PYTHON_TOOL_PREFIX}}check-jsonschema --builtin-schema github-workflows .github/workflows/*.yml'
      - '{{.PYTHON_TOOL_PREFIX}}check-jsonschema --builtin-schema dependabot .github/dependabot.yml'
      - '{{.PYTHON_TOOL_PREFIX}}check-jsonschema --builtin-schema vendor.github-actions .github/actions/*/action.yml'
      - '{{.PYTHON_TOOL_PREFIX}}check-jsonschema --builtin-schema vendor.taskfile Taskfile.yml'

  validate:workflows:
    desc: 'GitHub configuration: lint GitHub Actions workflows.'
    cmds:
      - actionlint

  validate:workflow-audit:
    desc: 'Security: audit GitHub Actions workflows and actions.'
    cmds:
      # zizmor does not descend into .github/actions on its own, so the action
      # definitions are named alongside the workflows.
      - zizmor --no-online-audits .github/workflows/ .github/actions/

  validate:public-safety:
    desc: 'Security: check tracked content for ignored files and personal paths.'
    cmds:
      - ./scripts/check-publication-safety.sh

  validate:safety-patterns:
    desc: 'Security: check that the publication-safety file controls agree.'
    cmds:
      - ./scripts/check-publication-safety-patterns.sh

  validate:secrets:
    desc: 'Security: scan repository history for secrets.'
    cmds:
      - gitleaks git --redact --verbose .

  validate:ansible:
    desc: 'Components: check the Ansible role, its fixture play, and its declared contract.'
    preconditions:
      - sh: '{{.PYTHON_TOOL_PREFIX}}ansible-lint --version >/dev/null 2>&1'
        msg: 'ansible-lint runs from neither {{.VENV_BIN}} nor PATH. See docs/validation.md for the setup commands.'
    cmds:
      # The fixture play lives inside the role it uses, so neither Ansible nor
      # ansible-lint resolves that role by its own defaults. The roles path is
      # given on each command rather than in an `env:` block, so that what Task
      # prints is the whole invocation.
      - ANSIBLE_ROLES_PATH=ansible/roles {{.PYTHON_TOOL_PREFIX}}ansible-playbook --syntax-check --inventory ansible/roles/qemu_guest_agent/tests/inventory.yml ansible/roles/qemu_guest_agent/tests/role.yml
      # --offline keeps the check from reaching for collections; the role needs
      # none, so nothing has to be fetched for it to be linted.
      - ANSIBLE_ROLES_PATH=ansible/roles {{.PYTHON_TOOL_PREFIX}}ansible-lint --offline ansible/roles/qemu_guest_agent
      - '{{.PYTHON_TOOL_PREFIX}}python3 ansible/roles/qemu_guest_agent/tests/check-role-contract.py'

  validate:composition:
    desc: 'Components: check that the connection output composes into ordinary Ansible inventory.'
    preconditions:
      - sh: '{{.PYTHON_TOOL_PREFIX}}ansible-inventory --version >/dev/null 2>&1'
        msg: 'ansible-inventory runs from neither {{.VENV_BIN}} nor PATH. See docs/validation.md for the setup commands.'
    cmds:
      # Ansible reads the committed fixture back: the three values the module
      # publishes, unchanged, in an inventory of the kind a consumer writes by
      # hand. The other half of this evidence — that the connection output
      # composes into exactly that document — is asserted by
      # tests/composition.tftest.hcl, which validate:tofu runs.
      #
      # Nothing here reads OpenTofu state, generates inventory, or runs the
      # role: the composition stays the consumer's to perform.
      - >-
        {{.PYTHON_TOOL_PREFIX}}ansible-inventory
        --inventory tofu/modules/proxmox-linux-vm/tests/composition-inventory.yml --list
        | jq -e '(._meta.hostvars["fictional-vm"] == {ansible_host: "192.0.2.10", ansible_user: "fictional", ansible_port: 22})
        and (.fictional_guests.hosts == ["fictional-vm"])'

  validate:tofu:
    desc: 'Components: check the OpenTofu module and run its contract tests. Needs public network access.'
    cmds:
      # Formatting covers the test files too, which tofu fmt understands.
      - tofu fmt -check -recursive tofu/
      # init installs the provider the module declares. The lock file is read
      # only, so a provider that no longer matches the committed lock fails
      # here instead of being silently replaced. There is no backend to
      # configure: the module declares none, and consumers own their own.
      - tofu -chdir=tofu/modules/proxmox-linux-vm init -input=false -backend=false -lockfile=readonly
      - tofu -chdir=tofu/modules/proxmox-linux-vm validate
      # The tests mock the provider, so they contact no Proxmox endpoint, need
      # no credentials, and create nothing.
      - tofu -chdir=tofu/modules/proxmox-linux-vm test

  validate:example:
    desc: 'Components: check the separate-repository consumer example. Needs public network access.'
    preconditions:
      - sh: '{{.PYTHON_TOOL_PREFIX}}ansible-lint --version >/dev/null 2>&1'
        msg: 'ansible-lint runs from neither {{.VENV_BIN}} nor PATH. See docs/validation.md for the setup commands.'
    cmds:
      - tofu fmt -check -recursive examples/
      # The example points both components at a toolkit checkout it does not
      # contain, because acquiring one is the consumer's job. The script builds
      # that checkout as a temporary fixture, runs the example's own tools
      # inside it, and prints every command it runs. It writes nothing here.
      - PYTHON_TOOL_PREFIX={{.PYTHON_TOOL_PREFIX}} ./examples/separate-consumer-repository/tests/check-example.sh
      # The structural half, which the tools above cannot assert: one full
      # commit SHA, both components resolving from one checkout, and no
      # acquisition, orchestration, state, or secret mechanism in the example.
      - '{{.PYTHON_TOOL_PREFIX}}python3 examples/separate-consumer-repository/tests/check-example-contract.py'
