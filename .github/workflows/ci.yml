name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.19.0 "**/*.md"

      - name: Check links
        uses: lycheeverse/lychee-action@885c65f3dc543b57c898c8099f4e08c8afd178a2  # v2.6.1
        with:
          args: --no-progress "**/*.md"
          fail: true

  github:
    name: GitHub configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
        with:
          python-version: "3.13"

      - name: Install YAML validators
        run: python -m pip install --disable-pip-version-check check-jsonschema==0.36.1 yamllint==1.37.1

      - name: Lint YAML
        run: yamllint .

      - name: Validate GitHub schemas
        run: |
          check-jsonschema --builtin-schema github-workflows .github/workflows/*.yml
          check-jsonschema --builtin-schema dependabot .github/dependabot.yml

      - name: Install actionlint
        run: |
          mkdir /tmp/actionlint
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash \
            --output /tmp/download-actionlint.bash
          bash /tmp/download-actionlint.bash 1.7.12 /tmp/actionlint

      - name: Lint GitHub Actions workflows
        run: /tmp/actionlint/actionlint -color

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check public repository safety
        run: |
          tracked_ignored="$(git ls-files --cached --ignored --exclude-standard)"
          if [[ -n "${tracked_ignored}" ]]; then
            echo "Tracked files match public-safety ignore rules:"
            echo "${tracked_ignored}"
            exit 1
          fi

          if git grep -nE '/(Users|home)/[^/[:space:]]+/' -- .; then
            echo "Absolute personal filesystem path found."
            exit 1
          fi

      - name: Audit GitHub Actions
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054  # v0.6.2
        with:
          advanced-security: false
          online-audits: false
          version: v1.29.0

      - name: Install gitleaks
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks

      - name: Scan repository history for secrets
        run: /tmp/gitleaks git --redact --verbose .
