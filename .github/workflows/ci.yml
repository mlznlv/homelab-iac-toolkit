name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Each job installs the toolchain this repository declares and then runs the
# same Task entry points a contributor runs locally, so the check definitions,
# tool versions, configuration and pass/fail semantics are shared rather than
# restated here. docs/validation.md documents them, and every task wraps a
# command that can be run directly.

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the declared toolchain
        uses: ./.github/actions/install-toolchain

      - name: Check whitespace and the dependency lock
        run: task validate:whitespace validate:python-lock

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the declared toolchain
        uses: ./.github/actions/install-toolchain

      - name: Lint Markdown and check links
        run: task validate:markdown validate:links

  github:
    name: GitHub configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the declared toolchain
        uses: ./.github/actions/install-toolchain
        with:
          python-packages: 'true'

      - name: Lint YAML, schemas, and workflows
        run: task validate:yaml validate:schemas validate:workflows

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      # The secret scan reads history, so this checkout is not shallow.
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the declared toolchain
        uses: ./.github/actions/install-toolchain

      - name: Audit workflows and check publication safety
        run: |
          task validate:workflow-audit validate:public-safety \
            validate:safety-patterns validate:secrets
