name: Implementation task
description: Implement one approved specification.
title: "[Task]: "
body:
  - type: markdown
    attributes:
      value: |
        Claude Code implements one approved specification at a time. Do not expand scope or introduce architecture decisions during implementation.

  - type: input
    id: spec
    attributes:
      label: Approved specification
      description: Link the approved specification implemented by this task.
      placeholder: "#123"
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: Required changes
      description: Summarize the implementation work defined by the specification.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: List the checks that must pass before review.
      placeholder: |
        - [ ] Relevant automated checks pass
        - [ ] Documentation is updated where required
        - [ ] No private or environment-specific data is included
    validations:
      required: true

  - type: checkboxes
    id: readiness
    attributes:
      label: Ready for implementation
      options:
        - label: The linked specification is approved and has no unresolved architecture decisions.
          required: true
