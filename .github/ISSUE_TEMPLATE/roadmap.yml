name: Roadmap item
description: Propose an outcome for the project roadmap.
title: "[Roadmap]: "
body:
  - type: markdown
    attributes:
      value: |
        Roadmap items are owned by Product Ownership. Keep proposals outcome-focused; architecture and implementation belong in linked follow-up issues.

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should be true when this roadmap item is complete?
      placeholder: Describe the user or project outcome.
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Why it matters
      description: What problem does this solve, and for whom?
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Completion evidence
      description: List the observable results that would show the outcome is complete.
      placeholder: |
        - Result one
        - Result two
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and links
      description: Link related roadmap items, accepted decisions, or known blockers. Write "None" if there are none.
    validations:
      required: true
