# Ordinary Ansible configuration for this repository.
#
# `roles_path` is the other half of the single-revision contract. It reaches
# ansible/roles/ inside vendor/homelab-iac-toolkit/, the same checkout
# ../tofu/main.tf resolves its module from, so one commit determines both the
# module implementation and the role implementation. ../toolkit-revision.yml
# declares which commit that is.
#
# Ansible resolves the relative paths below against the directory holding this
# file, not against the working directory, so they keep pointing at the same
# places wherever you run from. What does depend on the working directory is
# whether Ansible finds this file at all: it looks in the current directory, so
# run the playbook from here, or name this file in ANSIBLE_CONFIG.
#
# Everything below is an ordinary Ansible setting. Nothing here is a toolkit
# interface, and you may replace all of it.
#
# There is no connection, privilege-escalation, or credential configuration in
# this file. How you authenticate to a guest is yours: no key, password, vault
# identity, or secret loader belongs in a public example, or in source control.

[defaults]
roles_path = ../vendor/homelab-iac-toolkit/ansible/roles
inventory = inventory.yml
